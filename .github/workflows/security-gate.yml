name: Security Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for deep secret scanning history

      # --- GATE 1: SECRET SCANNING ---
            # --- GATE 1: SECRET SCANNING (UPDATED) ---
      - name: Scan for Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown


      - name: Perform CodeQL Analysis
        if: github.event.repository.private == false
        uses: github/codeql-action/analyze@v3

      # Option B: If your repo is PRIVATE, use Semgrep (Free tier works great in CI)
      - name: Scan with Semgrep
        if: github.event.repository.private == true
        run: |
          pip install semgrep
          semgrep ci --config=auto --error

